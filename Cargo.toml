[workspace]
resolver = "3"
members = ["client", "common", "server"]

[workspace.dependencies]
anyhow = "1.0.105"
tokio = { version = "1.54.1", features = [
	"macros",
	"rt-multi-thread",
	"net",
	"io-std",
] }
futures-util = "0.3.34"
clap = { version = "4.6.9", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ephcom-common = { path = "common" }
version = { path = "version" }
